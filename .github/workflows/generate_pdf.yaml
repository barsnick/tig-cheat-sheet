name: Generate PDF document from TeX
on: [push, workflow_dispatch]

jobs:
  build_pdf_from_tex:
    runs-on: ubuntu-latest
    env:
      PDF_FILENAME: tig-cheat-sheet.pdf
    permissions:
      contents: write
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Compile TeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: tig-cheat-sheet.tex
      - name: Upload PDF file to workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PDF_FILENAME }}
          path: ${{ env.PDF_FILENAME }}
      - name: Commit latest PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add the latest PDF rendering
          file_pattern: ${{ env.PDF_FILENAME }}
